# Top-level dependencies only. This is the file a person installs from; it is
# not a lock file. The exact package set that produced the results in
# docs/agent-reports/ is pinned in environment.lock.yml.
#
#   conda env create -f environment.yml
#   conda activate ee
#   earthengine authenticate
#
name: ee
channels:
  - conda-forge
dependencies:
  - python=3.12
  - earthengine-api>=1.7
  - geemap>=0.38
  - streamlit>=1.66
  - streamlit-folium>=0.27
  - folium>=0.20
  - pandas>=3.1
  - requests>=2.34
